services:
  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    container_name: ovpn-dashboard-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - hub-config:/etc/ovpn-dashboard
    environment:
      # Optional — if unset, a random password is generated on first boot
      # and printed once to `docker compose logs`.
      # ADMIN_PASSWORD: "changeme"

volumes:
  hub-config:
